name: Build John Design Core
on:
  push:
    paths:
      - 'plugin-src/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify plugin ZIP
        run: |
          mkdir -p dist
          cat             plugin-src/package.b64.part1             plugin-src/package.b64.part2a             plugin-src/package.b64.part2b             plugin-src/package.b64.part3             plugin-src/package.b64.part4             plugin-src/package.b64.part5             | tr -d '\n\r ' | base64 --decode > dist/johndesign-core.zip
          unzip -t dist/johndesign-core.zip
      - name: Commit verified distribution ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/johndesign-core.zip
          git diff --cached --quiet && exit 0
          git commit -m "Build verified John Design Core distribution"
          git push
